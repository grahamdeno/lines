name: bump version

# When app files change on main without a version bump, bump the patch version
# in core.js and sw.js so installed apps see the release (see README, Releases).

on:
  push:
    branches: [main]
    paths:
      - index.html
      - '*.js'
      - '*.css'
      - manifest.webmanifest
      - icons/**
      - sample/**

permissions:
  contents: write

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bump if needed
        id: bump
        run: echo "version=$(bash .github/scripts/bump-version.sh '${{ github.event.before }}')" >> "$GITHUB_OUTPUT"
      - name: Test, commit and push
        if: steps.bump.outputs.version != ''
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          node --test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $VERSION: bump version so installed apps update"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
